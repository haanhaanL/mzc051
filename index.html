<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<link rel="icon" href="data:,">
<style>
html, body { height: 100%; margin: 0; padding: 0; }
body {
    margin: 0; padding: 8px; background-color: #faf7f9; font-family: sans-serif;
    box-sizing: border-box; min-height: 100vh;
}
.container {
    width: 100%; max-width: 1600px; min-height: calc(100vh - 16px);
    margin: 0 auto; box-sizing: border-box; padding-bottom: 100px;
}
h1 { text-align: center; color: #ea3690; font-size: 18px; margin: 10px 0; }
.update-time { text-align: center; color: #999; font-size: 12px; margin-bottom: 12px; }

/* 单独一行涨幅 */
.headline-deltas {
    text-align: center;
    margin: -4px 0 14px 0;
}
.headline-deltas .delta-box {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 6px 18px;
    border-radius: 999px;
    font-size: 13px;
    background: #fff;
    border: 1px solid rgba(234,54,144,0.25);
    box-shadow: 0 2px 8px rgba(234,54,144,0.10);
}
.headline-deltas .delta-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
}
.headline-deltas .delta-divider {
    width: 1px;
    height: 16px;
    background: rgba(234,54,144,0.20);
}
.headline-deltas .delta-label {
    color: #999;
    font-size: 12px;
}
.headline-deltas .up {
    color: #ea3690;
    font-weight: bold;
    font-size: 14px;
}
.headline-deltas .down {
    color: #27ae60;
    font-weight: bold;
    font-size: 14px;
}
.headline-deltas .flat {
    color: #999;
    font-weight: bold;
    font-size: 14px;
}

.card {
    background: white; border-radius: 12px; box-shadow: 0 4px 12px rgba(234,54,144,0.08);
    padding: 12px 0; overflow: hidden; border: 1px solid rgba(234,54,144,0.10);
}
.title { text-align: center; color: #ea3690; font-size: 15px; font-weight: bold; margin: 5px 0 8px 0; }

.table-scroll-box {
    width: 100%; overflow-x: auto; overflow-y: auto; -webkit-overflow-scrolling: touch;
    flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
}
.table-scroll-box::-webkit-scrollbar { display: none; }

.recent-table {
    width: 100%; height: 100%; border-collapse: separate; border-spacing: 0;
    font-size: 12px; table-layout: fixed; min-width: 720px;
}
.recent-table th, .recent-table td {
    padding: 8px 5px; text-align: center; border-bottom: 1px solid #f3e6ee;
    white-space: nowrap; line-height: 1.5;
}
.recent-table th {
    background-color: #ea3690 !important; color: #ffffff; font-weight: bold; font-size: 11px;
    position: sticky; top: 0; z-index: 2; border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 1px 0 #f3e6ee;
}
.recent-table td:first-child {
    position: sticky; left: 0; z-index: 1; color: #555; background-color: #ffffff;
    width: 96px; min-width: 96px; max-width: 96px;
}
.recent-table col.col-time { width: 96px; }
.recent-table col.col-type { width: 56px; }
.recent-table col.col-metric { width: auto; }

.recent-table th.col-time-sticky,
.recent-table td.time-cell {
    position: sticky; left: 0; z-index: 6;
    background-color: #ffffff;
}
.recent-table th.col-type-sticky,
.recent-table td.type-cell {
    position: sticky; left: 96px; z-index: 6;
    background-color: inherit;
}
.recent-table thead th.col-time-sticky { z-index: 22; background-color: #ea3690 !important; }
.recent-table thead th.col-type-sticky { z-index: 22; background-color: #ea3690 !important; }
.recent-table td.time-cell { vertical-align: middle; }

.recent-table tbody tr.row-daily { background-color: #ffffff; }
.recent-table tbody tr.row-weekly { background-color: #fdf7fa; }
.recent-table tbody tr.row-daily td.time-cell,
.recent-table tbody tr.row-daily td.type-cell { background-color: #ffffff; }
.recent-table tbody tr.row-weekly td.time-cell,
.recent-table tbody tr.row-weekly td.type-cell { background-color: #fdf7fa; }

.type-badge {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 3px;
    line-height: 14px;
}
.type-badge.daily { background: #fff4e5; color: #fa8c16; }
.type-badge.weekly { background: #fde7f1; color: #ea3690; }

.range-tabs { display: flex; justify-content: center; gap: 8px; margin: 2px 0 6px 0; }
.range-btn {
    border: 1px solid rgba(234,54,144,0.35); background: white; color: #ea3690;
    font-size: 12px; padding: 3px 12px; border-radius: 12px;
    cursor: pointer; outline: none; font-family: inherit;
}
.range-btn.active { background: #ea3690; color: #fff; border-color: #ea3690; }
.chart-legend-text { text-align: center; font-size: 12px; color: #666; margin: 0 8px 6px 8px; line-height: 1.8; }
.chart-legend-text .item { display: inline-block; margin: 0 5px; }
.chart-legend-text .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 4px; vertical-align: middle;
}

.empty-row td { color: #999; padding: 30px 0; }

.cell-main { font-weight: bold; color: #333; }
.cell-change { font-size: 11px; margin-left: 1px; }
.cell-change.up { color: #ea3690; }
.cell-change.down { color: #27ae60; }
.cell-change.flat { color: #999; }

.page-grid { display: flex; flex-direction: column; gap: 12px; }
.table-card { display: flex; flex-direction: column; max-height: 620px; }
.table-card .table-scroll-box { flex: 1 1 auto; min-height: 0; }

.charts-row { display: flex; gap: 12px; width: 100%; }
.chart-card {
    flex: 1 1 50%; min-width: 0; height: 460px;
    display: flex; flex-direction: column;
}
.chart-card .chart-wrapper-flex { flex: 1 1 auto; min-height: 0; }

@media (max-width: 900px) {
    .charts-row { flex-wrap: wrap; }
    .chart-card { flex: 1 1 100%; height: 380px; }
}

#global-watermark {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 99999;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='120'><text x='20' y='70' font-size='28' font-weight='900' fill='rgba(234,54,144,0.06)' transform='rotate(-25 100 60)'>mzc051</text></svg>");
    background-repeat: repeat;
    background-size: 200px 120px;
}
</style>
</head>
<body>
<div class="container">
  <h1>阴天也会有烦恼吗</h1>
  <div class="update-time" id="update-time">加载中…</div>
  <div class="headline-deltas" id="headlineDeltas"></div>

  <div class="page-grid">
    <div class="card table-card">
      <div class="title">周/日榜记录 · 最近 12 条</div>
      <div class="table-scroll-box">
        <table class="recent-table" id="data-table">
          <colgroup>
            <col class="col-time">
            <col class="col-type">
            <col class="col-metric">
            <col class="col-metric">
            <col class="col-metric">
            <col class="col-metric">
          </colgroup>
          <thead>
            <tr>
              <th colspan="2" class="col-time-sticky">时间</th>
              <th>总分</th>
              <th>播放热度</th>
              <th>畅销度</th>
              <th>推荐度</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="charts-row">
      <div class="card chart-card">
        <div class="title" id="lineTitle">分数趋势</div>
        <div class="range-tabs" data-chart="lineRange">
          <button class="range-btn active" data-range="weekly">周榜</button>
          <button class="range-btn" data-range="daily">日榜</button>
        </div>
        <div class="chart-legend-text" id="lineLegend"></div>
        <div class="chart-wrapper-flex" id="chartLine"></div>
      </div>

      <div class="card chart-card">
        <div class="title">三维度</div>
        <div class="range-tabs" data-chart="radarRange">
          <button class="range-btn active" data-range="weekly">周榜</button>
          <button class="range-btn" data-range="daily">日榜</button>
        </div>
        <div class="chart-legend-text" id="radarLegend"></div>
        <div class="chart-wrapper-flex" id="chartRadar"></div>
      </div>
    </div>
  </div>
</div>

<div id="global-watermark"></div>

<script>
const DAILY_CSV = "daily.csv";
const WEEKLY_CSV = "weekly.csv";
const METRICS = ["综合得分", "播放热度", "畅销度", "推荐度"];
const RADAR_METRICS = ["播放热度", "畅销度", "推荐度"];
const LINE_FIELDS = [
  { key: "综合得分", label: "总分", color: "#ea3690" },
  { key: "播放热度", label: "播放热度", color: "#7c3aed" },
  { key: "畅销度", label: "畅销度", color: "#f97316" },
  { key: "推荐度", label: "推荐度", color: "#00c853" }
];
const TABLE_FIELDS = [
  { key: "综合得分", changeKey: "涨幅" },
  { key: "播放热度", changeKey: "播放热度涨幅" },
  { key: "畅销度", changeKey: "畅销度涨幅" },
  { key: "推荐度", changeKey: "推荐度涨幅" }
];

let dailyRows = [], weeklyRows = [];
let lineTab = "weekly", radarTab = "weekly";
let chartLine = null, chartRadar = null;

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const header = lines[0].split(",").map(s => s.replace(/^\uFEFF/, "").trim());
  return lines.slice(1).filter(Boolean).map(line => {
    const cells = line.split(",");
    const obj = {};
    header.forEach((h, i) => obj[h] = (cells[i] || "").trim());
    return obj;
  });
}
function parseTime(s) {
  const m = s.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})/);
  if (!m) return null;
  return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]);
}
function fmtTime(dt) {
  const p = n => String(n).padStart(2, "0");
  return `${p(dt.getMonth() + 1)}/${p(dt.getDate())} ${p(dt.getHours())}:${p(dt.getMinutes())}`;
}
function dateKey(dt) {
  return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
}
function businessDay(dt) {
  const d = new Date(dt);
  const minutes = d.getHours() * 60 + d.getMinutes();
  if (minutes <= 20) d.setDate(d.getDate() - 1);
  return dateKey(d);
}
function businessWeek(dt) {
  const d = new Date(dt);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return dateKey(d);
}

/* 表头下方单独一行：日榜涨幅 / 周榜涨幅
   日榜：最后一天最新一条 - 当天 06:06（没有 06:06 就找 6:06，解析后等价）
   周榜：最新一条 - 它所在周周一 00:26 */
function computeHeadlineDeltas() {
  let dailyDelta = "-";
  let weeklyDelta = "-";
  const num = v => {
    const n = parseFloat(v);
    return isNaN(n) ? null : n;
  };

  // 日榜
  const dGroups = new Map();
  for (const r of dailyRows) {
    const dt = parseTime(r["时间"]);
    if (!dt) continue;
    const k = dateKey(dt);
    if (!dGroups.has(k)) dGroups.set(k, []);
    dGroups.get(k).push({ dt, r });
  }
  const dKeys = [...dGroups.keys()].sort();
  if (dKeys.length) {
    const list = dGroups.get(dKeys[dKeys.length - 1]).sort((a, b) => a.dt - b.dt);
    const latest = list[list.length - 1];
    const six = list.find(x => x.dt.getHours() === 6 && x.dt.getMinutes() === 6);
    if (latest && six) {
      const a = num(latest.r["综合得分"]);
      const b = num(six.r["综合得分"]);
      if (a !== null && b !== null) dailyDelta = (a - b).toFixed(2);
    }
  }

  // 周榜
  let latestW = null;
  for (const r of weeklyRows) {
    const dt = parseTime(r["时间"]);
    if (!dt) continue;
    if (!latestW || dt > latestW.dt) latestW = { dt, r };
  }
  if (latestW) {
    const d = new Date(latestW.dt);
    const day = d.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    const weekKey = dateKey(d);

    let monday026 = null;
    for (const r of weeklyRows) {
      const dt = parseTime(r["时间"]);
      if (!dt) continue;
      if (dateKey(dt) === weekKey && dt.getHours() === 0 && dt.getMinutes() === 26) {
        monday026 = { dt, r };
        break;
      }
    }
    if (monday026) {
      const a = num(latestW.r["综合得分"]);
      const b = num(monday026.r["综合得分"]);
      if (a !== null && b !== null) weeklyDelta = (a - b).toFixed(2);
    }
  }

  return { dailyDelta, weeklyDelta };
}

function fmtDelta(v) {
  if (v === "-" || v == null) return "-";
  const n = parseFloat(v);
  if (isNaN(n)) return "-";
  return (n > 0 ? "+" : "") + n.toFixed(2);
}
function deltaCls(v) {
  const n = parseFloat(v);
  return isNaN(n) ? "flat" : (n > 0 ? "up" : (n < 0 ? "down" : "flat"));
}

function renderHeadlineDeltas() {
  const { dailyDelta, weeklyDelta } = computeHeadlineDeltas();
  const el = document.getElementById("headlineDeltas");
  if (!el) return;
  el.innerHTML =
    `<div class="delta-box">`
    + `<span class="delta-item"><span class="delta-label">日榜</span> `
    + `<span class="${deltaCls(dailyDelta)}">${fmtDelta(dailyDelta)}</span></span>`
    + `<span class="delta-divider"></span>`
    + `<span class="delta-item"><span class="delta-label">周榜</span> `
    + `<span class="${deltaCls(weeklyDelta)}">${fmtDelta(weeklyDelta)}</span></span>`
    + `</div>`;
}

function renderTable() {
  const tbody = document.querySelector("#data-table tbody");
  tbody.innerHTML = "";

  const sortAsc = rows => rows
    .filter(r => parseTime(r["时间"]))
    .sort((a, b) => parseTime(a["时间"]) - parseTime(b["时间"]));

  const dailyAsc = sortAsc(dailyRows);
  const weeklyAsc = sortAsc(weeklyRows);

  const addChanges = (rows) => rows.map(r => {
    const changes = {};
    TABLE_FIELDS.forEach(f => {
      changes[f.key] = (r[f.changeKey] || "").trim();
    });
    return { ...r, _changes: changes, _dt: parseTime(r["时间"]) };
  });

  const daily = addChanges(dailyAsc).map(r => ({ ...r, _type: "日榜" }));
  const weekly = addChanges(weeklyAsc).map(r => ({ ...r, _type: "周榜" }));

  const map = new Map();
  for (const r of [...daily, ...weekly]) {
    const key = fmtTime(r._dt);
    if (!map.has(key)) map.set(key, { dt: r._dt });
    map.get(key)[r._type] = r;
  }
  const keys = [...map.keys()]
    .sort((a, b) => map.get(b).dt - map.get(a).dt)
    .slice(0, 12);

  if (!keys.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="6">暂无数据</td></tr>';
    return;
  }

  const renderCells = (group, type) => {
    const r = group[type];
    return TABLE_FIELDS.map(f => {
      if (!r) return `<td>-</td>`;
      const val = r[f.key] || "-";
      const change = r._changes[f.key] || "";
      let changeText = "-", cls = "flat";
      if (change) {
        const num = parseFloat(change);
        changeText = (num > 0 ? "+" : "") + change;
        cls = num > 0 ? "up" : (num < 0 ? "down" : "flat");
      }
      return `<td><span class="cell-main">${val}</span> / <span class="cell-change ${cls}">${changeText}</span></td>`;
    }).join("");
  };

  for (const key of keys) {
    const group = map.get(key);

    const trDaily = document.createElement("tr");
    trDaily.className = "row-daily";
    trDaily.innerHTML = `<td rowspan="2" class="time-cell">${key}</td>`
      + `<td class="type-cell"><span class="type-badge daily">日榜</span></td>`
      + `${renderCells(group, "日榜")}`;
    tbody.appendChild(trDaily);

    const trWeekly = document.createElement("tr");
    trWeekly.className = "row-weekly";
    trWeekly.innerHTML = `<td class="type-cell"><span class="type-badge weekly">周榜</span></td>`
      + `${renderCells(group, "周榜")}`;
    tbody.appendChild(trWeekly);
  }
}

/* 日榜序列：横轴固定 06:06 到 00:16，无数据也完整 */
function dailySeries() {
  const groups = new Map();
  for (const r of dailyRows) {
    const dt = parseTime(r["时间"]);
    if (!dt) continue;
    const key = businessDay(dt);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push({ dt, r });
  }
  const keys = [...groups.keys()].sort().slice(-7);
  const data = { "综合得分": [], "播放热度": [], "畅销度": [], "推荐度": [] };
  const labels = [], axisLabels = [];
  let lastDay = null;

  const fullSlots = [];
  for (let h = 6; h <= 23; h++) fullSlots.push(`${String(h).padStart(2, "0")}:06`);
  fullSlots.push("00:16");

  const bySlot = new Map();
  for (const k of keys) {
    const list = groups.get(k)
      .filter(x => {
        const m = x.dt.getHours() * 60 + x.dt.getMinutes();
        return m >= 6 * 60 + 6;
      })
      .sort((a, b) => a.dt - b.dt);
    if (list.length) lastDay = list[list.length - 1].dt;
    for (const { dt, r } of list) {
      const slot = `${String(dt.getHours()).padStart(2, "0")}:${String(dt.getMinutes()).padStart(2, "0")}`;
      if (!bySlot.has(slot)) bySlot.set(slot, { dt, r });
    }
  }

  for (const slot of fullSlots) {
    labels.push(slot);
    axisLabels.push(slot);
    const hit = bySlot.get(slot);
    for (const m of METRICS) data[m].push(hit ? (parseFloat(hit.r[m]) || null) : null);
  }

  return { labels, axisLabels, data, last: pickLast(groups), lastDay };
}

/* 周榜序列：横轴固定本周 7 天，无数据也完整 */
function weeklySeries() {
  const now = new Date();
  const weekKey = businessWeek(now);
  const groups = new Map();
  for (const r of weeklyRows) {
    const dt = parseTime(r["时间"]);
    if (!dt) continue;
    if (businessWeek(dt) !== weekKey) continue;
    const k = businessDay(dt);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push({ dt, r });
  }
  const data = { "综合得分": [], "播放热度": [], "畅销度": [], "推荐度": [] };
  const labels = [], axisLabels = [];

  const monday = new Date(now);
  const day = monday.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  monday.setDate(monday.getDate() + diff);

  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(d.getDate() + i);
    const p = n => String(n).padStart(2, "0");
    const label = `${p(d.getMonth() + 1)}/${p(d.getDate())}`;
    labels.push(label);
    axisLabels.push(label);
    const dayKey = businessDay(d);
    const list = (groups.get(dayKey) || []).sort((a, b) => a.dt - b.dt);
    let hit = null;
    if (list.length) {
      const early = list.find(x => {
        const m = x.dt.getHours() * 60 + x.dt.getMinutes();
        return m >= 26;
      }) || list[0];
      hit = early;
    }
    for (const m of METRICS) data[m].push(hit ? (parseFloat(hit.r[m]) || null) : null);
  }

  return { labels, axisLabels, data, last: pickLast(groups) };
}

function pickLast(groups) {
  let latest = null;
  for (const list of groups.values()) {
    for (const item of list) {
      if (!latest || item.dt > latest.dt) latest = item;
    }
  }
  return latest;
}

function deltaAt(series, idx, key) {
  const arr = series.data[key];
  const cur = arr[idx];
  if (cur === null || cur === undefined) return null;
  for (let j = idx - 1; j >= 0; j--) {
    if (arr[j] !== null && arr[j] !== undefined) {
      return cur - arr[j];
    }
  }
  return null;
}

function renderLineChart() {
  const series = lineTab === "daily" ? dailySeries() : weeklySeries();
  document.getElementById("lineLegend").innerHTML =
  LINE_FIELDS.map(f => `<span class="item"><span class="dot" style="background:${f.color}"></span>${f.label}</span>`).join("");

  const titleEl = document.getElementById("lineTitle");
  if (lineTab === "daily") {
    titleEl.textContent = series.lastDay ? `分数趋势 · ${fmtTime(series.lastDay)}` : "分数趋势";
  } else {
    titleEl.textContent = "分数趋势";
  }

  if (!chartLine) chartLine = echarts.init(document.getElementById("chartLine"));

  const seriesOpt = LINE_FIELDS.map(f => ({
    name: f.label,
    type: "line",
    data: series.data[f.key],
    smooth: false,
    symbol: "circle",
    symbolSize: 4,
    connectNulls: false,
    itemStyle: { color: f.color },
    lineStyle: { width: 2, color: f.color },
    emphasis: { focus: "series" }
  }));

  let min = Infinity, max = -Infinity;
  Object.values(series.data).forEach(arr => arr.forEach(v => {
    if (v !== null && v !== undefined && !isNaN(v)) {
      if (v < min) min = v;
      if (v > max) max = v;
    }
  }));
  let yMin, yMax;
  if (!isFinite(min) || !isFinite(max)) {
    yMin = 0; yMax = 100;
  } else {
    const pad = Math.max((max - min) * 0.1, 1);
    yMin = Math.floor((min - pad) / 5) * 5;
    yMax = Math.ceil((max + pad) / 5) * 5;
    if (yMax > 100) yMax = 100;
    if (yMax <= yMin) yMax = yMin + 5;
    if (yMin < 0) yMin = 0;
  }

  chartLine.setOption({
    tooltip: {
      trigger: "axis",
      confine: true,
      formatter: function (params) {
        if (!params.length) return "";
        const i = params[0].dataIndex;
        const label = series.labels[i];
        let html = `<div style="font-weight:bold;margin-bottom:6px;font-size:12px;">${label}</div>`;
        const sorted = params.filter(p => p.value !== null && p.value !== undefined).sort((a, b) => b.value - a.value);
        if (!sorted.length) {
          html += `<div style="color:#999;">无数据</div>`;
          return html;
        }
        sorted.forEach(p => {
          const field = LINE_FIELDS.find(f => f.label === p.seriesName);
          const d = field ? deltaAt(series, i, field.key) : null;
          let deltaText = "-", deltaColor = "#999";
          if (d !== null && !isNaN(d)) {
            deltaText = (d > 0 ? "+" : "") + d.toFixed(2);
            deltaColor = d > 0 ? "#ea3690" : "#999";
          }
          html += `<div style="display:flex;align-items:center;gap:12px;min-width:230px;line-height:20px;">`
            + `<span style="display:flex;align-items:center;gap:4px;flex:1;min-width:0;">`
            + `<span>${p.marker}</span>`
            + `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.seriesName}</span>`
            + `<span style="margin-left:auto;font-weight:bold;color:#333;">${p.value}</span>`
            + `</span>`
            + `<span style="width:60px;text-align:right;white-space:nowrap;font-weight:bold;color:${deltaColor};">${deltaText}</span>`
            + `</div>`;
        });
        return html;
      }
    },
    grid: { left: "2%", right: "5%", bottom: "14%", top: "8%", containLabel: true },
    xAxis: {
      type: "category",
      boundaryGap: false,
      data: series.axisLabels,
      axisLabel: {
        interval: 0,
        fontSize: 10,
        color: "#888",
        rotate: 45,
        formatter: function (value) { return value || ""; }
      },
      axisLine: { lineStyle: { color: "#f0d6e4" } }
    },
    yAxis: {
      type: "value",
      min: yMin,
      max: yMax,
      minInterval: 1,
      axisLabel: { fontSize: 10, color: "#888" },
      axisLine: { lineStyle: { color: "#f0d6e4" } },
      splitLine: { lineStyle: { color: "#faf0f6" } }
    },
    series: seriesOpt
  }, true);
  chartLine.resize();
}

function renderRadarChart() {
  const series = radarTab === "daily" ? dailySeries() : weeklySeries();
  if (!chartRadar) chartRadar = echarts.init(document.getElementById("chartRadar"));
  const last = series.last;
  if (!last) {
    chartRadar.setOption({
      title: { text: "暂无数据", left: "center", top: "middle", textStyle: { color: "#999", fontSize: 14 } }
    }, true);
    document.getElementById("radarLegend").innerHTML = "";
    return;
  }
  const dims = RADAR_METRICS.map(name => ({ name, key: name }));
  const indicators = dims.map(d => ({ name: d.name, max: 100 }));
  const value = dims.map(d => {
    const v = parseFloat(last.r[d.key]);
    return isNaN(v) ? 0 : v;
  });

  document.getElementById("radarLegend").innerHTML =
    `<span class="item" style="color:#ea3690;font-weight:bold;">最近一条：${fmtTime(last.dt)}</span>`;

  const lastIdx = series.labels.indexOf(fmtTime(last.dt));

  chartRadar.setOption({
    tooltip: {
      trigger: "item",
      confine: true,
      formatter: function () {
        let html = `<div style="font-weight:bold;margin-bottom:6px;font-size:12px;">${fmtTime(last.dt)}</div>`;
        dims.forEach(d => {
          const val = last.r[d.key] || "-";
          const dlt = lastIdx >= 0 ? deltaAt(series, lastIdx, d.key) : null;
          let deltaText = "-", deltaColor = "#999";
          if (dlt !== null && !isNaN(dlt)) {
            deltaText = (dlt > 0 ? "+" : "") + dlt.toFixed(2);
            deltaColor = dlt > 0 ? "#ea3690" : "#999";
          }
          html += `<div style="display:flex;align-items:center;gap:12px;min-width:230px;line-height:20px;">`
            + `<span style="display:flex;align-items:center;gap:4px;flex:1;min-width:0;">`
            + `<span style="color:#999;">${d.name}</span>`
            + `<span style="margin-left:auto;font-weight:bold;color:#333;">${val}</span>`
            + `</span>`
            + `<span style="width:60px;text-align:right;white-space:nowrap;font-weight:bold;color:${deltaColor};">${deltaText}</span>`
            + `</div>`;
        });
        return html;
      }
    },
    radar: {
      indicator: indicators,
      center: ["50%", "55%"],
      radius: "55%",
      axisName: {
        formatter: function (name) {
          const idx = indicators.findIndex(x => x.name === name);
          const v = idx >= 0 ? value[idx] : "";
          return `{name|${name}}\n{value|${v}}`;
        },
        rich: {
          name: { color: "#999", fontSize: 12, fontWeight: "normal", lineHeight: 18 },
          value: { color: "#ea3690", fontSize: 13, fontWeight: "bold", lineHeight: 18 }
        }
      },
      splitLine: { lineStyle: { color: "#f0d6e4" } },
      splitArea: { areaStyle: { color: ["#fdf7fa", "#ffffff"] } },
      axisLine: { lineStyle: { color: "#f0d6e4" } }
    },
    series: [{
      type: "radar",
      data: [{
        value,
        name: "最新",
        areaStyle: { color: "rgba(234,54,144,0.25)" },
        lineStyle: { color: "#ea3690", width: 2 },
        itemStyle: { color: "#ea3690" }
      }]
    }]
  }, true);
  chartRadar.resize();
}

document.querySelectorAll('.range-tabs[data-chart="lineRange"] .range-btn').forEach(btn => {
  btn.addEventListener("click", function () {
    this.parentNode.querySelectorAll(".range-btn").forEach(b => b.classList.remove("active"));
    this.classList.add("active");
    lineTab = this.dataset.range;
    renderLineChart();
  });
});
document.querySelectorAll('.range-tabs[data-chart="radarRange"] .range-btn').forEach(btn => {
  btn.addEventListener("click", function () {
    this.parentNode.querySelectorAll(".range-btn").forEach(b => b.classList.remove("active"));
    this.classList.add("active");
    radarTab = this.dataset.range;
    renderRadarChart();
  });
});

async function load() {
  const [d, w] = await Promise.all([
    fetch(DAILY_CSV).then(r => r.text()).catch(() => ""),
    fetch(WEEKLY_CSV).then(r => r.text()).catch(() => "")
  ]);
  dailyRows = d ? parseCSV(d) : [];
  weeklyRows = w ? parseCSV(w) : [];

  const all = [...dailyRows, ...weeklyRows]
    .map(r => parseTime(r["时间"]))
    .filter(Boolean)
    .sort((a, b) => b - a);
  document.getElementById("update-time").textContent =
    all.length ? `最近更新：${fmtTime(all[0])}` : "暂无数据";

  renderHeadlineDeltas();
  renderTable();
  renderLineChart();
  renderRadarChart();
}
load();

let resizeTimer;
window.addEventListener("resize", function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () {
    if (chartLine) chartLine.resize();
    if (chartRadar) chartRadar.resize();
  }, 200);
});
</script>
</body>
</html>
