<script>
const DAILY_CSV = "daily.csv";
const WEEKLY_CSV = "weekly.csv";
const WEIBO_CSV = "weibo_trend.csv";
const HOURLY_CSV = "combined_06.csv";
const WEIBO_FIELDS = ["阅读量", "讨论量", "互动量", "原创量"];
const METRICS = ["综合得分", "播放热度", "畅销度", "推荐度"];
const RADAR_METRICS = ["播放热度", "畅销度", "推荐度"];
const LINE_FIELDS = [
  { key: "综合得分", label: "总分", color: "#ea3690" },
  { key: "播放热度", label: "播放热度", color: "#7c3aed" },
  { key: "畅销度", label: "畅销度", color: "#f97316" },
  { key: "推荐度", label: "推荐度", color: "#00c853" }
];
const TABLE_FIELDS = [
  { key: "综合得分", changeKey: "涨幅" },
  { key: "播放热度", changeKey: "播放热度涨幅" },
  { key: "畅销度", changeKey: "畅销度涨幅" },
  { key: "推荐度", changeKey: "推荐度涨幅" }
];

let dailyRows = [], weeklyRows = [], weiboRows = [], hourlyRows = [];
let lineTab = "daily", radarTab = "daily";
let chartLine = null, chartRadar = null;
let tableMode = "official";

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (!lines.length) return [];
  const header = lines[0].split(",").map(s => s.replace(/^\uFEFF/, "").trim());
  return lines.slice(1).filter(Boolean).map(line => {
    const cells = line.split(",");
    const obj = {};
    header.forEach((h, i) => obj[h] = (cells[i] || "").trim());
    return obj;
  });
}
function parseTime(s) {
  if (!s) return null;
  let m = s.match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})\s+(\d{1,2}):(\d{2})/);
  if (!m) return null;
  return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]);
}
function fmtTime(dt) {
  const p = n => String(n).padStart(2, "0");
  return `${p(dt.getMonth() + 1)}/${p(dt.getDate())} ${p(dt.getHours())}:${p(dt.getMinutes())}`;
}
function dateKey(dt) {
  return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
}
function businessDay(dt) {
  const d = new Date(dt);
  const minutes = d.getHours() * 60 + d.getMinutes();
  if (minutes <= 20) d.setDate(d.getDate() - 1);
  return dateKey(d);
}
function businessWeek(dt) {
  const d = new Date(dt);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return dateKey(d);
}
function shortDate(k) {
  if (!k) return "-";
  const [, m, d] = k.split("-");
  return `${m}/${d}`;
}

function computeHeadlineDeltas() {
  let dailyDelta = "-";
  let weeklyDelta = "-";
  const dailyDimDeltas = { "播放热度": "-", "畅销度": "-", "推荐度": "-" };
  const weeklyDimDeltas = { "播放热度": "-", "畅销度": "-", "推荐度": "-" };
  const DIMS = ["播放热度", "畅销度", "推荐度"];
  const num = v => { const n = parseFloat(v); return isNaN(n) ? null : n; };

  // —— 日榜涨幅：当前业务日最后一条 − 当日 06:06（00:16 归前一天）——
  const dGroups = new Map();
  for (const r of dailyRows) {
    const dt = parseTime(r["时间"]);
    if (!dt) continue;
    const k = businessDay(dt);
    if (!dGroups.has(k)) dGroups.set(k, []);
    dGroups.get(k).push({ dt, r });
  }
  const dKeys = [...dGroups.keys()].sort();
  if (dKeys.length) {
    const lastKey = dKeys[dKeys.length - 1];
    const list = dGroups.get(lastKey).sort((a, b) => a.dt - b.dt);
    const latest = list[list.length - 1];
    const six = list.find(x => x.dt.getHours() === 6 && x.dt.getMinutes() === 6) || list[0];
    if (latest && six) {
      const a = num(latest.r["综合得分"]);
      const b = num(six.r["综合得分"]);
      if (a !== null && b !== null) dailyDelta = (a - b).toFixed(2);
      DIMS.forEach(d => {
        const x = num(latest.r[d]);
        const y = num(six.r[d]);
        if (x !== null && y !== null) dailyDimDeltas[d] = (x - y).toFixed(2);
      });
    }
  }

  // —— 周榜涨幅：周一 00:26 − 周二 00:06；周二~周六 次日00:06 − 当天00:06；周日 周一00:16 − 周日00:06 ——
  function findAt(dayStr, hh, mm) {
    for (const r of weeklyRows) {
      const dt = parseTime(r["时间"]);
      if (!dt) continue;
      if (dateKey(dt) === dayStr && dt.getHours() === hh && dt.getMinutes() === mm) {
        return { dt, r };
      }
    }
    return null;
  }

  let latestW = null;
  for (const r of weeklyRows) {
    const dt = parseTime(r["时间"]);
    if (!dt) continue;
    if (!latestW || dt > latestW.dt) latestW = { dt, r };
  }

  if (latestW) {
    const curDt = latestW.dt;
    const curDayStr = dateKey(curDt);
    const curWeekday = curDt.getDay();
    const isMonday = curWeekday === 1;

    const cur = findAt(curDayStr, 0, isMonday ? 26 : 6);

    if (cur) {
      const nextDay = new Date(cur.dt);
      nextDay.setDate(nextDay.getDate() + 1);
      const nextDayStr = dateKey(nextDay);
      const baseHour = 0;
      const baseMin = curWeekday === 0 ? 16 : 6;

      let base = findAt(nextDayStr, baseHour, baseMin);
      if (!base) {
        const target = new Date(nextDay);
        target.setHours(baseHour, baseMin, 0, 0);
        for (const r of weeklyRows) {
          const dt = parseTime(r["时间"]);
          if (!dt) continue;
          if (dt <= target && dt > cur.dt && (!base || dt > base.dt)) base = { dt, r };
        }
      }

      if (base) {
        const a = num(cur.r["综合得分"]);
        const b = num(base.r["综合得分"]);
        if (a !== null && b !== null) weeklyDelta = (b - a).toFixed(2);
        DIMS.forEach(d => {
          const x = num(cur.r[d]);
          const y = num(base.r[d]);
          if (x !== null && y !== null) weeklyDimDeltas[d] = (y - x).toFixed(2);
        });
      }
    }
  }

  // —— 日榜目标需求：取最新整点6分数据，目标 − 该分数，除以剩余小时数 ——
  const TARGET = { "播放热度": 90, "畅销度": 99.1, "推荐度": 96 };
  let latestPoint = null; // 最新一条 xx:06 数据
  for (const r of dailyRows) {
    const dt = parseTime(r["时间"]);
    if (!dt) continue;
    if (dt.getMinutes() !== 6) continue;      // 只读整点6分
    if (!latestPoint || dt > latestPoint.dt) latestPoint = { dt, r };
  }
  // 00:16~06:00 之间（新旧一天交替）显示占位符 -
  let inResetWindow = false;
  if (latestPoint) {
    const minsOfDay = latestPoint.dt.getHours() * 60 + latestPoint.dt.getMinutes();
    inResetWindow = minsOfDay >= 16 && minsOfDay < 6 * 60;
  }
  const remainHours = latestPoint ? Math.max(1, 24 - latestPoint.dt.getHours()) : 1;
  const dailyTargetNeed = {};
  DIMS.forEach(d => {
    const cur = latestPoint ? parseFloat(latestPoint.r[d]) : NaN;
    if (inResetWindow) {
      dailyTargetNeed[d] = '-';
    } else if(TARGET[d] <= cur) {
      dailyTargetNeed[d] = '达成'
    } else {
      dailyTargetNeed[d] = isNaN(cur) ? "-" : ((TARGET[d] - cur) / remainHours).toFixed(2);
    }
  });

  return { dailyDelta, weeklyDelta, dailyDimDeltas, weeklyDimDeltas, dailyTargetNeed };
}

function renderHeadlineDeltas() {
  const { dailyDelta, weeklyDelta, dailyDimDeltas, weeklyDimDeltas, dailyTargetNeed } = computeHeadlineDeltas();
  const el = document.getElementById("headlineDeltas");
  if (!el) return;
  const DIMS = ["播放热度", "畅销度", "推荐度"];
  const fmtOne = v => {
    if (v === "-" || v == null || v === "") return "-";
    const n = parseFloat(v);
    if (isNaN(n)) return "-";
    return (n > 0 ? "+" : "") + n.toFixed(2);
  };
  const clsOne = v => {
    const n = parseFloat(v);
    return isNaN(n) ? "flat" : (n > 0 ? "up" : (n < 0 ? "down" : "flat"));
  };
  const buildLine = (label, total, dims, typeCls) => {
    const dimsHtml = DIMS.map(d =>
      `<span class="delta-dim ${clsOne(dims[d])}">${fmtOne(dims[d])}</span>`
    ).join("");
    return `<div class="delta-line ${typeCls}">`
      + `<span class="delta-badge">${label}</span>`
      + `<span class="delta-total ${clsOne(total)}">${fmtOne(total)}</span>`
      + `<span class="delta-divider"></span>`
      + dimsHtml
      + `</div>`;
  };

  const targetLine = `<div class="delta-line target-line">`
    + `<span class="delta-target-label" style="grid-column: 1 / 4; text-align:right; padding-right:8px;">今日日榜目标</span>`
    + DIMS.map(d =>
        `<span class="delta-dim target-val">${d === "播放热度" ? 90 : d === "畅销度" ? 99.1 : 96}</span>`
      ).join("")
    + `</div>`;

  const needLine = `<div class="delta-line need-line">`
    + `<span class="delta-need-label" style="grid-column: 1 / 4; text-align:right; padding-right:8px;">每小时涨幅需求</span>`
    + DIMS.map(d =>
        `<span class="delta-dim need-val">${dailyTargetNeed[d] === "-" ? "-" : dailyTargetNeed[d]}</span>`
      ).join("")
    + `</div>`;

  el.innerHTML =
    `<div class="delta-box">`
    + `<div class="delta-head">`
    + `<span></span>`
    + `<span class="delta-dim-head">总分</span>`
    + `<span></span>`
    + DIMS.map(d => `<span class="delta-dim-head">${d}</span>`).join("")
    + `</div>`
    + buildLine("日榜", dailyDelta, dailyDimDeltas, "daily")
    + buildLine("周榜", weeklyDelta, weeklyDimDeltas, "weekly")
    + `<div class="delta-sep"></div>`
    + targetLine
    + needLine
    + `</div>`;
}

function renderTable() {
  const tbody = document.querySelector("#data-table tbody");
  tbody.innerHTML = "";
  const titleEl = document.getElementById("dataTableTitle");
  if (titleEl) {
    titleEl.textContent = tableMode === "hourly"
      ? "由你榜-每小时 · 最近 12 条"
      : "由你榜-官方CD · 最近 12 条";
  }

  if (tableMode === "hourly") {
    const rows = hourlyRows
      .map(r => ({ ...r, _dt: parseTime(r["时间"]), _type: r["榜单"] || "" }))
      .filter(r => r._dt);
    if (!rows.length) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="6">暂无数据</td></tr>';
      return;
    }
    const byTime = new Map();
    for (const r of rows) {
      const key = fmtTime(r._dt);
      if (!byTime.has(key)) byTime.set(key, { dt: r._dt, 日榜: null, 周榜: null });
      const g = byTime.get(key);
      if (r._type === "日榜") g["日榜"] = r;
      else if (r._type === "周榜") g["周榜"] = r;
    }
    const keys = [...byTime.keys()]
      .sort((a, b) => byTime.get(b).dt - byTime.get(a).dt)
      .slice(0, 12);
    keys.forEach((key, idx) => {
      const g = byTime.get(key);
      const altCls = idx % 2 === 1 ? " row-group-alt" : "";
      const trDaily = document.createElement("tr");
      trDaily.className = "row-daily" + altCls;
      trDaily.innerHTML = `<td rowspan="2" class="time-cell">${key}</td>`
        + `<td class="type-cell"><span class="type-badge daily">日榜</span></td>`
        + renderCellsFromCombined(g["日榜"]);
      tbody.appendChild(trDaily);
      const trWeekly = document.createElement("tr");
      trWeekly.className = "row-weekly" + altCls;
      trWeekly.innerHTML = `<td class="type-cell"><span class="type-badge weekly">周榜</span></td>`
        + renderCellsFromCombined(g["周榜"]);
      tbody.appendChild(trWeekly);
    });
    return;
  }

  const daily = dailyRows.map(r => ({ ...r, _type: "日榜", _dt: parseTime(r["时间"]) })).filter(r => r._dt);
  const weekly = weeklyRows.map(r => ({ ...r, _type: "周榜", _dt: parseTime(r["时间"]) })).filter(r => r._dt);
  const map = new Map();
  for (const r of [...daily, ...weekly]) {
    const key = fmtTime(r._dt);
    if (!map.has(key)) map.set(key, { dt: r._dt });
    map.get(key)[r._type] = r;
  }
  const keys = [...map.keys()]
    .sort((a, b) => map.get(b).dt - map.get(a).dt)
    .slice(0, 12);
  if (!keys.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="6">暂无数据</td></tr>';
    return;
  }
  const renderCells = (group, type) => {
    const r = group[type];
    return TABLE_FIELDS.map(f => {
      if (!r) return `<td>-</td>`;
      const val = r[f.key] || "-";
      const change = (r[f.changeKey] || "").trim();
      let changeText = "-", cls = "flat";
      if (change && change !== "-") {
        const num = parseFloat(change);
        if (!isNaN(num)) {
          changeText = (num > 0 ? "+" : "") + change;
          cls = num > 0 ? "up" : (num < 0 ? "down" : "flat");
        }
      }
      return `<td><span class="cell-main">${val}</span> / <span class="cell-change ${cls}">${changeText}</span></td>`;
    }).join("");
  };
  keys.forEach((key, idx) => {
    const group = map.get(key);
    const altCls = idx % 2 === 1 ? " row-group-alt" : "";
    const trDaily = document.createElement("tr");
    trDaily.className = "row-daily" + altCls;
    trDaily.innerHTML = `<td rowspan="2" class="time-cell">${key}</td>`
      + `<td class="type-cell"><span class="type-badge daily">日榜</span></td>`
      + renderCells(group, "日榜");
    tbody.appendChild(trDaily);
    const trWeekly = document.createElement("tr");
    trWeekly.className = "row-weekly" + altCls;
    trWeekly.innerHTML = `<td class="type-cell"><span class="type-badge weekly">周榜</span></td>`
      + renderCells(group, "周榜");
    tbody.appendChild(trWeekly);
  });
}

function renderCellsFromCombined(r) {
  return TABLE_FIELDS.map(f => {
    if (!r) return `<td>-</td>`;
    const val = r[f.key] || "-";
    const change = (r[f.changeKey] || "").trim();
    let changeText = "-", cls = "flat";
    if (change && change !== "-") {
      const num = parseFloat(change);
      if (!isNaN(num)) {
        changeText = (num > 0 ? "+" : "") + change;
        cls = num > 0 ? "up" : (num < 0 ? "down" : "flat");
      }
    }
    return `<td><span class="cell-main">${val}</span> / <span class="cell-change ${cls}">${changeText}</span></td>`;
  }).join("");
}

function dailySeries() {
  const groups = new Map();
  for (const r of dailyRows) {
    const dt = parseTime(r["时间"]);
    if (!dt) continue;
    const key = businessDay(dt);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push({ dt, r });
  }

  const allKeys = [...groups.keys()].sort();
  const keys = allKeys.slice(-7);
  const todayKey = keys.length ? keys[keys.length - 1] : null;
  const prevKeys = keys.slice(0, -1);

  const fullSlots = [];
  for (let h = 6; h <= 23; h++) fullSlots.push(`${String(h).padStart(2, "0")}:06`);
  fullSlots.push("00:16");

  function buildBySlot(dayKey) {
    const bySlot = new Map();
    if (!dayKey) return bySlot;
    const list = groups.get(dayKey)
      .filter(x => {
        const h = x.dt.getHours();
        const m = x.dt.getMinutes();
        if (h === 0 && m === 16) return true;
        return h * 60 + m >= 6 * 60 + 6;
      })
      .sort((a, b) => a.dt - b.dt);
    for (const { dt, r } of list) {
      const slot = `${String(dt.getHours()).padStart(2, "0")}:${String(dt.getMinutes()).padStart(2, "0")}`;
      if (!bySlot.has(slot)) bySlot.set(slot, { dt, r });
    }
    return bySlot;
  }

  const todaySlots = buildBySlot(todayKey);

  const labels = [], axisLabels = [];
  const todayData = { "综合得分": [], "播放热度": [], "畅销度": [], "推荐度": [] };

  for (const slot of fullSlots) {
    labels.push(slot);
    axisLabels.push(slot);
    const t = todaySlots.get(slot);
    for (const m of METRICS) {
      todayData[m].push(t ? (parseFloat(t.r[m]) || null) : null);
    }
  }

  const prevDays = prevKeys.map(k => {
    const slots = buildBySlot(k);
    const data = { "综合得分": [], "播放热度": [], "畅销度": [], "推荐度": [] };
    for (const slot of fullSlots) {
      const p = slots.get(slot);
      for (const m of METRICS) {
        data[m].push(p ? (parseFloat(p.r[m]) || null) : null);
      }
    }
    return { key: k, data };
  });

  return {
    labels,
    axisLabels,
    data: todayData,
    prevData: prevDays.length ? prevDays[prevDays.length - 1].data : { "综合得分": [], "播放热度": [], "畅销度": [], "推荐度": [] },
    prevDays,
    todayKey,
    yestKey: prevDays.length ? prevDays[prevDays.length - 1].key : null,
    last: pickLast(groups),
    lastDay: null
  };
}

function weeklySeries() {
  const now = new Date();
  const weekKey = businessWeek(now);
  const list = weeklyRows
    .map(r => ({ dt: parseTime(r["时间"]), r }))
    .filter(x => x.dt && businessWeek(x.dt) === weekKey)
    .sort((a, b) => a.dt - b.dt);
  const data = { "综合得分": [], "播放热度": [], "畅销度": [], "推荐度": [] };
  const labels = [], axisLabels = [];
  const monday = new Date(now);
  const day = monday.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  monday.setDate(monday.getDate() + diff);
  monday.setHours(0, 0, 0, 0);
  const pickHours = [0, 4, 8, 12, 16, 20];
  const byDayHour = new Map();
  for (const { dt, r } of list) {
    const dk = dateKey(dt);
    const h = dt.getHours();
    if (!pickHours.includes(h)) continue;
    if (dt.getMinutes() !== 26) continue;
    if (!byDayHour.has(dk)) byDayHour.set(dk, new Map());
    byDayHour.get(dk).set(h, { dt, r });
  }
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(d.getDate() + i);
    const p = n => String(n).padStart(2, "0");
    const dk = dateKey(d);
    const dayLabel = `${p(d.getMonth() + 1)}/${p(d.getDate())}`;
    const hourMap = byDayHour.get(dk);
    for (let j = 0; j < pickHours.length; j++) {
      const h = pickHours[j];
      labels.push(`${dayLabel} ${p(h)}:26`);
      axisLabels.push(j === 0 ? dayLabel : "");
      const hit = hourMap ? hourMap.get(h) : null;
      for (const m of METRICS) data[m].push(hit ? (parseFloat(hit.r[m]) || null) : null);
    }
  }
  const lastItem = list.length ? list[list.length - 1] : null;
  return { labels, axisLabels, data, last: lastItem };
}

function pickLast(groups) {
  let latest = null;
  for (const list of groups.values()) {
    for (const item of list) {
      if (!latest || item.dt > latest.dt) latest = item;
    }
  }
  return latest;
}

function deltaAt(series, idx, key) {
  const arr = series.data[key];
  const cur = arr[idx];
  if (cur === null || cur === undefined) return null;
  for (let j = idx - 1; j >= 0; j--) {
    if (arr[j] !== null && arr[j] !== undefined) {
      return cur - arr[j];
    }
  }
  return null;
}

function mixColor(hex, ratio) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  const gray = (r + g + b) / 3;
  const mix = c => Math.round(c + (gray - c) * ratio);
  return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
}

        }

        // 日榜：固定顺序，各历史日 / 今日各自“值 / 涨幅”
        const dayCols = series.prevDays.map(d =>
          ({ key: d.key, label: shortDate(d.key), arr: d.data })
        );
        dayCols.push({ key: "today", label: "今日", arr: series.data });

        const deltaFor = (arr, idx) => {

          + `<span style="display:inline-block;width:${dotSize}px;height:${dotSize}px;border-radius:50%;background:${LINE_FIELDS[0].color};margin-right:2px;"></span>`
          + `<span>${LINE_FIELDS[0].label}</span></span>`

              ? (isToday ? "#ea3690" : "#fa8c16")
              : "#999";
            const gapHtml = ci > 0 ? `margin-left:${gapW}px;` : "";
            return `<span style="width:${metW}px;text-align:right;white-space:nowrap;font-size:${fontSize}px;${gapHtml}">`
              + `${has ? v : "-"} / `
              + `<span style="color:${dColor};">${fd.text}</span></span>`;
          }).join("");
          html += `<div style="display:flex;align-items:center;min-width:${minW}px;line-height:17px;">`
            + `<span style="width:${dateW}px;margin-right:4px;color:${isToday ? "#ea3690" : "#888"};font-weight:${isToday ? "bold" : "normal"};font-size:${headSize}px;">`
            + `${isToday ? "今日" : col.label}</span>`
            + cells
            + `</div>`;
        });

        return html;
      }
    },
    grid: { left: "2%", right: "5%", bottom: "14%", top: "8%", containLabel: true },
    xAxis: {
      type: "category",
      boundaryGap: false,
      data: series.axisLabels,
      axisLabel: {
        interval: lineTab === "daily" ? 3 : 0,
        fontSize: 10,
        color: "#888",
        rotate: 45,
        formatter: function (value) { return value || ""; }
      },
      axisLine: { lineStyle: { color: "#f0d6e4" } }
    },
    yAxis: {
      type: "value",
      min: yMin,
      max: yMax,
      minInterval: 1,
      axisLabel: { fontSize: 10, color: "#888" },
      axisLine: { lineStyle: { color: "#f0d6e4" } },
      splitLine: { lineStyle: { color: "#faf0f6" } }
    },
    series: seriesOpt
  }, true);
  chartLine.resize();
}

function renderRadarChart() {
  const series = radarTab === "daily" ? dailySeries() : weeklySeries();
  if (!chartRadar) chartRadar = echarts.init(document.getElementById("chartRadar"));
  const last = series.last;
  if (!last) {
    chartRadar.setOption({
      title: { text: "暂无数据", left: "center", top: "middle", textStyle: { color: "#999", fontSize: 14 } }
    }, true);
    document.getElementById("radarLegend").innerHTML = "";
    const radarTotalElEmpty = document.getElementById("radarTotal");
    if (radarTotalElEmpty) radarTotalElEmpty.innerHTML = "";
    return;
  }

  const { dailyDimDeltas, weeklyDimDeltas } = computeHeadlineDeltas();
  const dimDeltas = radarTab === "daily" ? dailyDimDeltas : weeklyDimDeltas;
  const isDaily = radarTab === "daily";

  const dims = RADAR_METRICS.map(name => ({ name, key: name }));
  const indicators = dims.map(d => ({ name: d.name, max: 100 }));

  // 三维度目标值（仅日榜使用）
  const TARGET = { "播放热度": 90, "畅销度": 99.1, "推荐度": 96 };
  const targetValues = dims.map(d => TARGET[d.key] ?? 0);

  const value = dims.map(d => {
    const v = parseFloat(last.r[d.key]);
    return isNaN(v) ? 0 : v;
  });

  // 图例：最新数据 + 目标（换行显示）
  document.getElementById("radarLegend").innerHTML =
    `<div class="item" style="display:block;color:#ea3690;font-weight:bold;">最新数据：${fmtTime(last.dt)}</div>`
    + (isDaily
      ? `<div class="item" style="display:block;margin-top:2px;"><span class="dot" style="background:#ffb6d9"></span>目标：推荐96 畅销99.1 播放90</div>`
      : "");

  const radarTotalEl = document.getElementById("radarTotal");
  if (radarTotalEl) {
    const totalVal = last.r["综合得分"];
    radarTotalEl.innerHTML =
      `<span class="radar-total-value">${totalVal || "-"}</span>`
      + `<span class="radar-total-label">总分</span>`;
  }

  // 目标系列（仅日榜）
  const targetSeries = isDaily ? [{
    value: targetValues,
    name: "目标",
    lineStyle: { width: 2, type: "solid", color: "#ffb6d9" },
    itemStyle: { color: "#ffb6d9" },
    areaStyle: { color: "transparent" }
  }] : [];

  chartRadar.setOption({
    tooltip: {
      trigger: "item",
      confine: true,
      formatter: function () {
        // 1. 时间
        let html = `<div style="font-weight:bold;margin-bottom:8px;font-size:12px;">${fmtTime(last.dt)}</div>`;

        // 2. 表头（放在时间后面，目标差列仅日榜）
        html += `<div style="display:flex;align-items:center;gap:10px;min-width:300px;line-height:18px;color:#bbb;font-size:11px;margin-bottom:4px;">`
          + `<span style="width:60px;">维度</span>`
          + `<span style="width:44px;text-align:right;">分数</span>`
          + `<span style="width:56px;text-align:right;">涨幅</span>`
          + (isDaily ? `<span style="width:64px;text-align:right;">目标差</span>` : "")
          + `</div>`;

        // 3. 数据行
        dims.forEach((d, i) => {
          const val = parseFloat(last.r[d.key]);
          const valText = isNaN(val) ? "-" : val;

          // 涨幅
          const raw = dimDeltas[d.key] || "-";
          let deltaText = "-", deltaColor = "#999";
          if (raw !== "-") {
            const n = parseFloat(raw);
            if (!isNaN(n)) {
              deltaText = (n > 0 ? "+" : "") + n.toFixed(2);
              deltaColor = n > 0 ? "#ea3690" : (n < 0 ? "#27ae60" : "#999");
            }
          }

          // 与目标差值（仅日榜，统一绿色）
          let gapHtml = "";
          if (isDaily) {
            const tgt = targetValues[i];
            let gapText = "-";
            if (!isNaN(val)) {
              const gap = val - tgt;
              gapText = (gap > 0 ? "+" : "") + gap.toFixed(2);
            }
            gapHtml = `<span style="width:64px;text-align:right;color:#27ae60;font-weight:bold;">${gapText}</span>`;
          }

          html += `<div style="display:flex;align-items:center;gap:10px;min-width:300px;line-height:22px;font-size:12px;">`
            + `<span style="width:60px;color:#999;">${d.name}</span>`
            + `<span style="width:44px;text-align:right;font-weight:bold;color:#333;">${valText}</span>`
            + `<span style="width:56px;text-align:right;color:${deltaColor};font-weight:bold;">${deltaText}</span>`
            + gapHtml
            + `</div>`;
        });

        return html;
      }
    },
    radar: {
      shape: "circle",
      startAngle: -90,
      indicator: indicators,
      center: ["50%", "40%"],
      radius: "72%",
      axisName: {
        formatter: function (name) {
          const idx = indicators.findIndex(x => x.name === name);
          const v = idx >= 0 ? value[idx] : "";
          return `{value|${v}}\n{name|${name}}`;
        },
        rich: {
          name: { color: "#bbb", fontSize: 12, fontWeight: "normal", lineHeight: 18 },
          value: { color: "#ea3690", fontSize: 13, fontWeight: "bold", lineHeight: 18 }
        }
      },
      splitNumber: 3,
      splitLine: { lineStyle: { color: "rgba(234,54,144,0.12)" } },
      splitArea: { show: false },
      axisLine: { lineStyle: { color: "rgba(234,54,144,0.15)" } }
    },
    series: [{
      type: "radar",
      symbol: "none",
      data: [
        ...targetSeries,
        {
          value,
          name: "最新",
          areaStyle: { color: "transparent" },
          lineStyle: {
            width: 5,
            join: "round",
            cap: "round",
            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
              { offset: 0, color: "#FF8E63" },
              { offset: 1, color: "#FF4BD2" }
            ])
          },
          itemStyle: { color: "#FF4BD2" }
        }
      ]
    }]
  }, true);
  chartRadar.resize();
}

document.querySelectorAll('.range-tabs[data-chart="lineRange"] .range-btn').forEach(btn => {
  btn.addEventListener("click", function () {

    this.classList.add("active");

document.querySelectorAll('.range-tabs[data-chart="radarRange"] .range-btn').forEach(btn => {

    this.classList.add("active");
    radarTab = this.dataset.range;

});

let dimsTab = "综合得分";
function renderDimsTable() {
  const theadRow = document.querySelector("#dims-table thead tr");
  const tbody = document.querySelector("#dims-table tbody");
  if (!theadRow || !tbody) return;
  const p = n => String(n).padStart(2, "0");

  const now = new Date();
  const monday = new Date(now);
  const day = monday.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  monday.setDate(monday.getDate() + diff);
  monday.setHours(0, 0, 0, 0);
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(d.getDate() + i);
    days.push(dateKey(d));
  }

  theadRow.innerHTML = `<th class="col-time-sticky">时间</th>`
    + days.map(dk => `<th>${shortDate(dk)}</th>`).join("");

  const byDateSlot = new Map();
  for (const r of dailyRows) {
    const dt = parseTime(r["时间"]);
    if (!dt) continue;
    if (dt.getMinutes() !== 6 && !(dt.getHours() === 0 && dt.getMinutes() === 16)) continue;
    const slot = `${p(dt.getHours())}:${p(dt.getMinutes())}`;
    const dk = dateKey(dt);
    if (!byDateSlot.has(dk)) byDateSlot.set(dk, new Map());
    byDateSlot.get(dk).set(slot, r);
  }

  const slots = [];
  for (let h = 6; h <= 23; h++) slots.push(`${p(h)}:06`);
  slots.push("00:16");

  tbody.innerHTML = "";
  slots.forEach(slot => {
    const vals = days.map((dk, idx) => {
      let r = null;
      if (slot === "00:16") {
        const next = new Date(monday);
        next.setDate(next.getDate() + idx + 1);
        const m = byDateSlot.get(dateKey(next));
        r = m ? m.get("00:16") : null;
      } else {
        const m = byDateSlot.get(dk);
        r = m ? m.get(slot) : null;
      }
      const v = r ? parseFloat(r[dimsTab]) : NaN;
      return isNaN(v) ? null : { text: r[dimsTab] || "-", num: v };
    });
    let max = -Infinity;
    let min = Infinity;
    vals.forEach(v => {
      if (!v) return;
      if (v.num > max) max = v.num;
      if (v.num < min) min = v.num;
    });
    const cells = vals.map(v => {
      if (!v) return `<td>-</td>`;
      const hl = v.num === max ? ' style="color:#ea3690;font-weight:bold;"'
        : (v.num === min ? ' style="color:#b0b0b0;font-weight:bold;"' : "");
      return `<td${hl}>${v.text}</td>`;
    }).join("");
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="time-cell">${slot}</td>${cells}`;
    tbody.appendChild(tr);
  });
}

document.querySelectorAll('#modeTabs .mode-btn').forEach(btn => {
  btn.addEventListener("click", function () {
    this.parentNode.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
    this.classList.add("active");

document.querySelectorAll('#dimsTabs .mode-btn').forEach(btn => {

    this.classList.add("active");
    dimsTab = this.dataset.dim;

function exportName(card) {
  let base = "";
  const t = card.querySelector(".title");
  if (t) base = t.textContent.split("·")[0].trim();
  const act = card.querySelector(".range-btn.active, .mode-btn.active");
  if (act) {
    if (act.dataset.range) base += "-" + (act.dataset.range === "daily" ? "日榜" : "周榜");
    else if (act.textContent) base += "-" + act.textContent;
  }
  const p = n => String(n).padStart(2, "0");
  const now = new Date();
  return `${base}-${now.getMonth() + 1}${p(now.getDate())}_${p(now.getHours())}${p(now.getMinutes())}`;
}

document.querySelectorAll(".export-btn").forEach(btn => {
  btn.addEventListener("click", function () {
    if (typeof html2canvas !== "function") return;
    const card = this.closest(".card");
    if (!card) return;
    this.disabled = true;
    html2canvas(card, { backgroundColor: "#ffffff", scale: 2 }).then(canvas => {
      const a = document.createElement("a");
      a.download = exportName(card) + ".png";
      a.href = canvas.toDataURL("image/png");
      a.click();
    }).catch(() => {}).finally(() => {
      this.disabled = false;
    });
  });
});

async function load() {
  const [d, w, wb, h] = await Promise.all([
    fetch(DAILY_CSV).then(r => r.text()).catch(() => ""),
    fetch(WEEKLY_CSV).then(r => r.text()).catch(() => ""),
    fetch(WEIBO_CSV).then(r => r.text()).catch(() => ""),
    fetch(HOURLY_CSV).then(r => r.text()).catch(() => "")
  ]);
  dailyRows = d ? parseCSV(d) : [];
  weeklyRows = w ? parseCSV(w) : [];
  weiboRows = wb ? parseCSV(wb) : [];
  hourlyRows = h ? parseCSV(h) : [];

  const all = [...dailyRows, ...weeklyRows, ...weiboRows, ...hourlyRows]
    .map(r => parseTime(r["时间"]))
    .filter(Boolean)
    .sort((a, b) => b - a);
  document.getElementById("update-time").textContent =
    all.length ? `最近更新：${fmtTime(all[0])}` : "暂无数据";

  renderHeadlineDeltas();
  renderTable();
  renderDimsTable();
  renderLineChart();
  renderRadarChart();
}
load();

let resizeTimer;
window.addEventListener("resize", function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () {
    if (chartLine) chartLine.resize();
    if (chartRadar) chartRadar.resize();
  }, 200);
});
</script>
