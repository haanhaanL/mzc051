name: run-once
on:
  workflow_dispatch:   # 只手动触发，不定时

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scrape.py
      - name: show result
        run: |
          echo "===== daily.csv ====="
          cat daily.csv
          echo "===== weekly.csv ====="
          cat weekly.csv
