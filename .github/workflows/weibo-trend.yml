name: weibo-trend
on:
  workflow_dispatch:   # 只手动触发，定时由 cron 用 curl 触发

concurrency:
  group: weibo-trend
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: run weibo trend
        env:
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
        run: python weibo_trend.py

      - name: commit csv
        if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          # 文件不存在时跳过，避免 git add 报 fatal
          if [ ! -f weibo_trend.csv ]; then
            echo "weibo_trend.csv 不存在，跳过提交（请看上一步诊断日志）"
            exit 0
          fi
          git add weibo_trend.csv
          if git diff --staged --quiet; then
            echo "没有变更，无需提交"
            exit 0
          fi
          git commit -m "update weibo trend $(date -u +%Y%m%d%H%M)"
          for i in 1 2 3; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "push 成功"; exit 0
            fi
            echo "push 失败，第 $i 次重试..."
            git pull --rebase origin ${{ github.ref_name }}
            sleep $((i * 2))
          done
          echo "重试 3 次后仍失败"; exit 1
